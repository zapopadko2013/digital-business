version: '3.3'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: digital_card
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: digital_card_api
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/digital_card?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      # Главное изменение: пробрасываем текущую папку внутрь контейнера
      - .:/app
      # Изолируем node_modules, чтобы хост не затирал линуксовые пакеты
      - /app/node_modules
      - /app/dist
    depends_on:
      - postgres

volumes:
  postgres_data:
